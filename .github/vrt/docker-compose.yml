services:
  api:
    image: visualregressiontracker/api:${VRT_VERSION}
    environment:
      DATABASE_URL: postgresql://vrt:vrt@postgres:5432/vrt
      JWT_SECRET: ci
      APP_FRONTEND_URL: http://localhost:8080
      BODY_PARSER_JSON_LIMIT: 5mb
    ports:
      - "4200:3000"
    depends_on:
      migration:
        condition: service_completed_successfully
  migration:
    image: visualregressiontracker/migration:${VRT_VERSION}
    environment:
      DATABASE_URL: postgresql://vrt:vrt@postgres:5432/vrt
      DEFAULT_USER_EMAIL: visual-regression-tracker@example.com
      DEFAULT_USER_PASSWORD: "123456"
      DEFAULT_USER_API_KEY: DEFAULTUSERAPIKEYTOBECHANGED
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vrt
      POSTGRES_PASSWORD: vrt
      POSTGRES_DB: vrt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d vrt -U vrt"]
      interval: 2s
      retries: 30
